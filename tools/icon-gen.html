<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台图标生成器</title>
<style>
body{background:#0b0e1a;color:#e8f6ff;font-family:"Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:30px;gap:16px}
h1{font-size:1.1rem;color:#00f0ff}
canvas{image-rendering:pixelated;border:1px solid #334}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:linear-gradient(90deg,#ff2bd6,#b04fff);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-family:inherit}
p{color:#9fb4d8;font-size:.8rem;max-width:560px;line-height:1.7}
</style>
</head>
<body>
<h1>任务笔记工作台 · 图标生成器</h1>
<canvas id="cv" width="512" height="512"></canvas>
<div class="row">
  <button id="d192">下载 192（常规）</button>
  <button id="d512">下载 512（常规）</button>
  <button id="dmask">下载 512（maskable）</button>
  <button id="d180">下载 180（iOS touch）</button>
</div>
<p>点击下载后把 PNG 存到 app/icons/ 覆盖同名文件即可。也可先双击用浏览器预览效果。</p>
<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
function draw(maskable) {
  const S = 512;
  ctx.clearRect(0, 0, S, S);
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, "#1a2240"); g.addColorStop(1, "#0b0e1a");
  ctx.fillStyle = g;
  const r = maskable ? 0 : Math.round(S * 0.22);
  roundedPath(ctx, r, r, S - 2 * r, S - 2 * r, r);
  ctx.fill();
  // 霓虹渐变描边
  const bg = ctx.createLinearGradient(0, 0, S, S);
  bg.addColorStop(0, "#00f0ff"); bg.addColorStop(1, "#ff2bd6");
  ctx.strokeStyle = bg; ctx.lineWidth = 8; ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 18;
  roundedPath(ctx, r + 4, r + 4, S - 2 * r - 8, S - 2 * r - 8, r - 4);
  ctx.stroke(); ctx.shadowBlur = 0;
  // 树（三分支 + 发光叶）
  const cx = S / 2, sc = maskable ? 0.74 : 1;
  function line(x0, y0, x1, y1, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  function leaf(x, y, rr, color) {
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  const base = S * 0.82, top = S * 0.38, off = (1 - sc) * S / 2;
  line(cx, base - off, cx, top + off, S * 0.032 * sc, "#00f0ff");
  line(cx, top * 1.05 + off, cx - S * 0.17, S * 0.22 + off, S * 0.024 * sc, "#ff2bd6");
  line(cx, top * 1.05 + off, cx + S * 0.18, S * 0.20 + off, S * 0.024 * sc, "#39ff88");
  line(cx, top + off, cx, S * 0.13 + off, S * 0.022 * sc, "#00f0ff");
  line(cx - S * 0.10, base + S * 0.02 - off, cx + S * 0.10, base + S * 0.02 - off, S * 0.02 * sc, "#ffd94f");
  const lr = S * 0.045 * sc;
  leaf(cx - S * 0.17, S * 0.22 + off, lr, "#ff2bd6");
  leaf(cx + S * 0.18, S * 0.20 + off, lr, "#39ff88");
  leaf(cx, S * 0.13 + off, lr, "#00f0ff");
  leaf(cx - S * 0.10, S * 0.17 + off, lr * 0.7, "#ffd94f");
  leaf(cx + S * 0.10, S * 0.16 + off, lr * 0.7, "#ff2bd6");
  leaf(cx - S * 0.07, S * 0.28 + off, lr * 0.62, "#39ff88");
  leaf(cx + S * 0.08, S * 0.27 + off, lr * 0.62, "#00f0ff");
}
function roundedPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function dl(size, maskable, name) {
  const off = document.createElement("canvas");
  off.width = off.height = size;
  const octx = off.getContext("2d");
  octx.drawImage(cv, 0, 0, size, size);
  const a = document.createElement("a");
  a.download = name; a.href = off.toDataURL("image/png");
  a.click();
}
draw(false);
document.getElementById("d192").onclick = () => dl(192, false, "icon-192.png");
document.getElementById("d512").onclick = () => dl(512, false, "icon-512.png");
document.getElementById("dmask").onclick = () => { draw(true); setTimeout(() => dl(512, true, "icon-maskable-512.png"), 50); };
document.getElementById("d180").onclick = () => dl(180, false, "icon-180.png");
</script>
</body>
</html>
